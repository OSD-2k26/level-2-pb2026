name: Git CTF Level 2 Validator
on: [push, workflow_dispatch]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history/branches
          
      - name: Run Validator
        run: |
          chmod +x validate.sh
          ./validate.sh
