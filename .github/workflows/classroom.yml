name: Git CTF Level 2 Validator
on: [push]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure all branches are tracked
        run: |
          git fetch --all
          # This forces local tracking of remote branches so the script sees them easily
          for remote in $(git branch -r | grep -v '\->'); do
            git branch --track "${remote#origin/}" "$remote" || true
          done

      - name: Make validator executable
        run: chmod +x validate.sh

      - name: Run validator
        run: ./validate.sh
